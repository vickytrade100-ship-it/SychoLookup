name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper
        run: gradle wrapper
        working-directory: SychoLookup/SychoLookup

      - name: Make gradlew executable
        run: chmod +x ./gradlew
        working-directory: SychoLookup/SychoLookup

      - name: Build Debug APK
        run: ./gradlew assembleDebug
        working-directory: SychoLookup/SychoLookup

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SychoLookup-debug
          path: SychoLookup/SychoLookup/app/build/outputs/apk/debug/app-debug.apk
